<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>En liten hilsen 🍫</title>
<style>
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#3b160e,#7b2f1f 55%,#c56a45);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden;color:white;
  }
  .card{
    width:min(82vw,520px); padding:48px 30px; text-align:center;
    border-radius:28px; background:rgba(255,255,255,.13);
    box-shadow:0 18px 60px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
    animation:pop .7s ease-out;
  }
  .emoji{font-size:64px;animation:bounce 1.4s ease-in-out infinite}
  h1{font-size:clamp(30px,8vw,52px);margin:18px 0 10px}
  p{font-size:20px;opacity:.9;margin:0}
  .heart{margin-top:28px;font-size:28px;letter-spacing:8px}
  @keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes bounce{50%{transform:translateY(-8px) rotate(-3deg)}}
  .spark{position:absolute;font-size:24px;animation:float 4s linear infinite;opacity:.7}
  @keyframes float{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
</style>
</head>
<body>
<span class="spark" style="left:12%;animation-delay:.2s">✨</span>
<span class="spark" style="left:78%;animation-delay:1.3s">♥</span>
<span class="spark" style="left:45%;animation-delay:2.2s">🍫</span>
<div class="card">
  <div class="emoji">🍫</div>
  <h1>Så koselig du ville scanne QR-koden igjen, da satte du sikkert pris på sjokoladen.</br>😍</h1>

</div>
</body>
</html>
